name: AutoLog Web DEV
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-dev
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BASE_PATH: /autolog-web
      EXPO_PUBLIC_SUPABASE_URL: https://kayqvlhwjxjecfbxkjuh.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lmVfZp1l0_l-_zsoBSM7ig_MQEj3yfm
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:web
      - run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: DEV
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
